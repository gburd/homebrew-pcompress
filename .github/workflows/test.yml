name: brew test-bot
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    # Intel macOS is a Homebrew Tier 3 platform: dependencies are built from
    # source and brew exits non-zero after a successful install. Informational.
    continue-on-error: ${{ matrix.runner == 'macos-15-intel' }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/gburd"
          ln -s "$PWD" "$(brew --repository)/Library/Taps/gburd/homebrew-pcompress"
      - name: Style
        run: brew style gburd/pcompress/pcompress
      - name: Audit (tap rules)
        run: brew audit --strict --online --formula gburd/pcompress/pcompress
      - name: Audit (homebrew-core rules, informational)
        continue-on-error: true
        run: brew audit --strict --online --new --formula gburd/pcompress/pcompress
      - name: Build from source
        run: brew install --build-from-source --verbose gburd/pcompress/pcompress || brew list gburd/pcompress/pcompress
      - name: Test
        run: brew test --verbose gburd/pcompress/pcompress
